services:
  - type: web
    name: projekt-zeitriss
    runtime: static
    buildCommand: echo "Keine Build-Schritte erforderlich"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
